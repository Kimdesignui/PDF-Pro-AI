<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Pro AI - Công cụ PDF thông minh bởi Kim Tiểu Kê</title>
    
    <meta name="description" content="Trình chỉnh sửa PDF miễn phí được thiết kế bởi Kim Tiểu Kê và vận hành bởi Google AI Studio." />
    <meta name="author" content="Kim Tiểu Kê" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Roboto', 'Segoe UI', 'Helvetica', 'sans-serif'],
            },
            // Tỉ lệ A4 chuẩn để không bị méo hình khi xem file
            aspectRatio: {
              'a4': '1 / 1.4141',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', 'Roboto', 'Segoe UI', 'Helvetica', sans-serif; }
      
      /* Xử lý thanh cuộn chuyên nghiệp cho Workspace */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
      .custom-scrollbar::-webkit-scrollbar-thumb { 
        background: #cbd5e1; 
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* AI Scanning Animation */
      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      .animate-scan { animation: scan 2s linear infinite; }

      /* AI Pulse/Wave Animation */
      @keyframes pulse-ring {
        0% { transform: scale(0.33); opacity: 0.5; }
        80%, 100% { opacity: 0; transform: scale(1.5); }
      }
      .animate-pulse-ring::before {
        content: '';
        position: absolute;
        left: 0; top: 0; right: 0; bottom: 0;
        border-radius: 50%;
        border: 2px solid #3b82f6;
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.0.379",
        "jspdf": "https://esm.sh/jspdf@2.5.1"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-700">
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
